{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "apexai.fullname" . }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.api.host }}
        - {{ .Values.ingress.app.host }}
      secretName: {{ include "apexai.fullname" . }}-tls
  rules:
    - host: {{ .Values.ingress.api.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "apexai.fullname" . }}-api
                port:
                  number: 80
    - host: {{ .Values.ingress.app.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "apexai.fullname" . }}-frontend
                port:
                  number: 80
{{- end }}

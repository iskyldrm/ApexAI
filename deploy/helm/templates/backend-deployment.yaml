apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apexai.fullname" . }}-api
  labels:
    app: {{ include "apexai.name" . }}-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "apexai.name" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "apexai.name" . }}-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: {{ .Values.env.app_env | quote }}
            - name: DATABASE_URL
              value: {{ .Values.env.database_url | quote }}
            - name: VAULT_URL
              value: {{ .Values.env.vault_url | quote }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "apexai.fullname" . }}-secrets
                  key: vault-token
            - name: REDIS_URL
              value: {{ .Values.env.redis_url | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "apexai.fullname" . }}-secrets
                  key: jwt-secret
            - name: COOKIE_SECURE
              value: {{ .Values.env.cookie_secure | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.env.cors_origins | quote }}
            - name: METRICS_ENABLED
              value: {{ .Values.env.metrics_enabled | quote }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apexai.fullname" . }}-api
  labels:
    app: {{ include "apexai.name" . }}-api
spec:
  type: ClusterIP
  selector:
    app: {{ include "apexai.name" . }}-api
  ports:
    - name: http
      port: 80
      targetPort: http

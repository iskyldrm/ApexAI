name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apexai
          POSTGRES_PASSWORD: apexai_dev
          POSTGRES_DB: apexai
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      vault:
        image: hashicorp/vault:1.17
        env:
          VAULT_DEV_ROOT_TOKEN_ID: apexai_dev_token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
        options: >-
          --cap-add IPC_LOCK
          --health-cmd "vault status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://apexai:apexai_dev@localhost:5433/apexai
      VAULT_URL: http://localhost:8200
      VAULT_TOKEN: apexai_dev_token
      REDIS_URL: redis://localhost:6380/0
      JWT_SECRET: ci-secret-32-bytes-minimum-please-change
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install deps
        run: cd backend && uv sync --all-extras
      - name: Run migrations
        run: cd backend && uv run alembic upgrade head
      - name: Run tests
        run: cd backend && uv run pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm type-check
      - run: cd frontend && pnpm build

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - run: helm lint deploy/helm
      - run: helm template apexai deploy/helm/ > /tmp/rendered.yaml
      - run: test -s /tmp/rendered.yaml

  docker-build:
    # Only build & push on main, not on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.GHCR_TOKEN != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ env.GHCR_TOKEN != '' }}
          tags: ghcr.io/${{ github.repository_owner }}/apexai-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ env.GHCR_TOKEN != '' }}
          tags: ghcr.io/${{ github.repository_owner }}/apexai-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

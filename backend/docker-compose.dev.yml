services:
  postgres:
    image: postgres:16
    container_name: apexai_postgres
    restart: unless-stopped
    ports:
      # Use 5433 to avoid conflict with other local postgres instances
      - "5433:5432"
    environment:
      - POSTGRES_DB=apexai
      - POSTGRES_USER=apexai
      - POSTGRES_PASSWORD=apexai_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexai"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: apexai_redis
    restart: unless-stopped
    ports:
      # Use 6380 to avoid conflict with other local redis instances
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  vault:
    image: hashicorp/vault:1.17
    container_name: apexai_vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=apexai_dev_token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_LOG_LEVEL=info
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
    command: server -dev -dev-root-token-id=apexai_dev_token -dev-listen-address=0.0.0.0:8200
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot seeder: creates the platform admin user, runs Alembic migrations.
  # Exit 0 once done. Compose waits for it before bringing up the API.
  seeder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apexai_seeder
    profiles: ["seed"]   # not started by `up -d` — use `up seeder` to run
    command: >
      sh -c "
        uv run alembic upgrade head &&
        uv run python -m app.db_seeder
      "
    environment:
      - DATABASE_URL=postgresql+psycopg://apexai:apexai_dev@postgres:5432/apexai
      - VAULT_URL=http://vault:8200
      - VAULT_TOKEN=apexai_dev_token
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=dev-secret-change-me-in-production-please-use-32-bytes-min
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  vault_data:
